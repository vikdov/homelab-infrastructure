# ansible.cfg
[defaults]
inventory = inventory/
roles_path = roles
interpreter_python = auto_silent
host_key_checking = True
forks = 10
stdout_callback = default
callback_result_format = yaml
bin_ansible_callbacks = True

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new

[inventory]
enable_plugins = community.proxmox.proxmox, ansible.builtin.yaml, ansible.builtin.ini
# to validate config: ansible-config validate -t all
