---
# Host-side settings only root on the PVE node can make (the API token cannot).
# Assumes the connection user is root on the node; add `become: true` otherwise.
- name: PVE | TUN device for LXC guests tagged vpn
  hosts: proxmox_nodes
  gather_facts: false
  vars:
    pve_vpn_lxcs: "{{ groups['tag_vpn'] | default([]) | intersect(groups['proxmox_all_lxc'] | default([])) }}"
  tasks:
    # Single node assumed: `pct` only sees containers on the local node.
    - name: Read current container config
      ansible.builtin.command:
        argv: [pct, config, "{{ hostvars[item].proxmox_vmid }}"]
      loop: "{{ pve_vpn_lxcs }}"
      register: pve_lxc_config
      changed_when: false
      check_mode: false

    - name: Pass /dev/net/tun into the container (first free devN slot)
      ansible.builtin.command:
        argv:
          - pct
          - set
          - "{{ hostvars[item.item].proxmox_vmid }}"
          - "--dev{{ _free_slot }}"
          - /dev/net/tun,mode=0666
      vars:
        _used_slots: "{{ item.stdout | regex_findall('(?m)^dev([0-9]+):') | map('int') | list }}"
        _free_slot: "{{ range(0, 256) | reject('in', _used_slots) | first }}"
      loop: "{{ pve_lxc_config.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stdout is not search('(?m)^dev[0-9]+:\s*(path=)?/dev/net/tun')
      register: pve_tun_added
      changed_when: true

    # `pct reboot` applies pending config changes. This restarts the container (for `net`: DNS and
    # Tailscale are briefly down).
    - name: Restart containers that got the device
      ansible.builtin.command:
        argv: [pct, reboot, "{{ hostvars[item.item.item].proxmox_vmid }}"]
      loop: "{{ pve_tun_added.results | selectattr('changed') | list }}"
      loop_control:
        label: "{{ item.item.item }}"
      when: hostvars[item.item.item].proxmox_status | default('') == 'running'
      changed_when: true

- name: PVE | node_exporter on the host
  hosts: proxmox_nodes
  gather_facts: false
  vars:
    # Prefer a specific address (e.g. "10.10.10.1:9100") over all interfaces; ":9100" relies on a
    # host firewall rule that restricts the port to the monitoring host.
    pve_node_exporter_listen: ":9100"
  tasks:
    - name: Install node exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present
        cache_valid_time: 3600

    - name: Set the node exporter listen address
      ansible.builtin.lineinfile:
        path: /etc/default/prometheus-node-exporter
        regexp: "^ARGS="
        line: 'ARGS="--web.listen-address={{ pve_node_exporter_listen }}"'
      notify: Restart node exporter

    - name: Enable node exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        enabled: true
        state: started

  handlers:
    - name: Restart node exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        state: restarted
