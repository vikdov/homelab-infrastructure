---
# Enables automatic security updates. Two drop-ins:
#   20auto-upgrades                    turns the daily apt timers' work on
#   52bootstrap-unattended-upgrades    replaces the stock origin list (see the template)
# Only Debian/Ubuntu security origins are matched. Third-party repos (Docker, Grafana, Proxmox)
# are intentionally not auto-upgraded.

- name: Validate unattended-upgrades reboot time
  ansible.builtin.assert:
    that: bootstrap_unattended_reboot_time is match('^([01][0-9]|2[0-3]):[0-5][0-9]$')
    fail_msg: "bootstrap_unattended_reboot_time must be HH:MM (24h), got '{{ bootstrap_unattended_reboot_time }}'"
    quiet: true

- name: Periodic apt settings
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"

# Sorts after the stock 50unattended-upgrades, so its #clear lines can reset the origin lists.
- name: Unattended-upgrades policy (security only)
  ansible.builtin.template:
    src: unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52bootstrap-unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Enable apt timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

# Opt-in diagnostic: run with -e bootstrap_unattended_dry_run=true, e.g. after pointing
# bootstrap_apt_mirror_rewrites at a custom mirror. Never fails the run.
- name: Dry-run unattended-upgrades (diagnostic only)
  ansible.builtin.command: unattended-upgrade --dry-run --debug
  become: true
  register: bootstrap_uu_dry
  changed_when: false
  failed_when: false
  when: bootstrap_unattended_dry_run | bool

- name: Show the origins unattended-upgrades will actually use
  ansible.builtin.debug:
    msg:
      rc: "{{ bootstrap_uu_dry.rc }}"
      origins: >-
        {{ bootstrap_uu_dry.stdout_lines
           | select('search', 'Allowed origins|No packages found|Packages that will be upgraded')
           | list }}
      errors: "{{ bootstrap_uu_dry.stderr_lines | default([]) }}"
  when: bootstrap_unattended_dry_run | bool
