---
- name: Validate settings
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
      - cloudflared_token | length > 0
      - cloudflared_token is match('^\S+$')
      - cloudflared_version is match('^[0-9]{4}[.][0-9]+[.][0-9]+$')
      - cloudflared_key_sha256 is match('^[0-9a-f]{64}$')
      - cloudflared_metrics is match('^[0-9]{1,3}([.][0-9]{1,3}){3}:[0-9]{1,5}$')
      - (cloudflared_metrics.split(':')[0].split('.') | map('int') | max) <= 255
      - (cloudflared_metrics.split(':')[1] | int) >= 1
      - (cloudflared_metrics.split(':')[1] | int) <= 65535
      - cloudflared_metrics.split(':')[0] != '0.0.0.0'
      - cloudflared_gomemlimit is match('^[0-9]+(B|KiB|MiB|GiB|TiB)$')
      - cloudflared_memory_max is match('^([0-9]+[KMGT]?|infinity)$')
    fail_msg: >-
      With cloudflared_state: present set cloudflared_token (vault, no whitespace),
      cloudflared_version (for example 2026.10.7), cloudflared_key_sha256 (64 hex characters) and
      cloudflared_metrics (a valid IPv4:port, not 0.0.0.0). cloudflared_gomemlimit must look like
      128MiB and cloudflared_memory_max like 256M. The host must be Debian-family. Use
      cloudflared_state: absent to remove the tunnel.
    quiet: true

- name: Preflight - outbound TCP 7844 to the Cloudflare edge
  ansible.builtin.wait_for:
    host: "{{ item }}"
    port: 7844
    timeout: 10
    msg: >-
      Cannot reach {{ item }}:7844/tcp. cloudflared needs outbound 7844 (QUIC over UDP, HTTP/2
      fallback over TCP). Open it in the host, Proxmox and upstream firewalls, or set
      cloudflared_egress_check: false if this probe is not meaningful here.
  loop: "{{ cloudflared_egress_hosts }}"
  when: cloudflared_egress_check | bool

- name: Signing key (checksum pinned)
  ansible.builtin.get_url:
    url: "{{ cloudflared_key_url }}"
    dest: /usr/share/keyrings/cloudflare-main.gpg
    checksum: "sha256:{{ cloudflared_key_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  register: cloudflared_key

- name: Repository (deb822)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/cloudflared.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible
      Types: deb
      URIs: https://pkg.cloudflare.com/cloudflared
      Suites: any
      Components: main
      Signed-By: /usr/share/keyrings/cloudflare-main.gpg
  register: cloudflared_repo

- name: Pin the package version (priority above 1000 also permits a rollback)
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/cloudflared
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible
      Package: cloudflared
      Pin: version {{ cloudflared_version }}
      Pin-Priority: 1001

- name: Refresh the package index when the repository or key changed
  ansible.builtin.apt:
    update_cache: true
    lock_timeout: "{{ cloudflared_apt_lock_timeout }}"
  when: cloudflared_repo is changed or cloudflared_key is changed

- name: Install cloudflared at the pinned version
  ansible.builtin.apt:
    name: "cloudflared={{ cloudflared_version }}"
    state: present
    allow_downgrade: true
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: "{{ cloudflared_apt_lock_timeout }}"
  register: cloudflared_package

- name: Service user
  ansible.builtin.user:
    name: cloudflared
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Configuration directory
  ansible.builtin.file:
    path: /etc/cloudflared
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Tunnel token (delivered via systemd LoadCredential, not the environment)
  ansible.builtin.copy:
    content: "{{ cloudflared_token }}"
    dest: /etc/cloudflared/token
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: cloudflared_token_file

- name: Environment (no secrets)
  ansible.builtin.template:
    src: env.j2
    dest: /etc/cloudflared.env
    owner: root
    group: root
    mode: "0644"
  register: cloudflared_env_file

- name: Systemd unit (remotely managed tunnel - ingress rules live in the dashboard)
  ansible.builtin.template:
    src: cloudflared.service.j2
    dest: /etc/systemd/system/cloudflared.service
    owner: root
    group: root
    mode: "0644"
  register: cloudflared_unit_result

# A real service only exists outside check mode. Restart, start and verify live in one block so a
# failure prints the service journal instead of a bare "uri failed" after a minute of retries.
- name: Start and verify the tunnel
  when: not ansible_check_mode
  block:
    - name: Restart when the package, unit, token or environment changed
      ansible.builtin.systemd:
        name: cloudflared
        state: restarted
        daemon_reload: true
      when: >-
        cloudflared_package is changed or cloudflared_token_file is changed
        or cloudflared_env_file is changed or cloudflared_unit_result is changed

    # Type=notify: systemd only reports the start as done once the tunnel is connected.
    - name: Enable and start
      ansible.builtin.systemd:
        name: cloudflared
        enabled: true
        state: started
        daemon_reload: true

    - name: Installed binary matches the pinned version
      ansible.builtin.command:
        argv: [/usr/bin/cloudflared, --version]
      register: cloudflared_binary_version
      changed_when: false
      failed_when: >-
        not (cloudflared_binary_version.stdout is search(
          'version\s+' ~ (cloudflared_version | regex_escape) ~ '(\s|$)'
        ))

    - name: Metrics endpoint is ready (tunnel connected)
      ansible.builtin.uri:
        url: "http://{{ cloudflared_metrics }}/ready"
        status_code: 200
      register: cloudflared_ready
      until: cloudflared_ready.status == 200
      retries: 10
      delay: 3
      changed_when: false

  rescue:
    - name: Collect the service state and recent log lines
      ansible.builtin.command:
        argv: [journalctl, -u, cloudflared, -n, "40", --no-pager, --output, cat]
      register: cloudflared_journal
      changed_when: false
      failed_when: false

    - name: Show the recent log lines
      ansible.builtin.debug:
        msg: "{{ cloudflared_journal.stdout_lines | default([]) }}"

    - name: Fail with context
      ansible.builtin.fail:
        msg: >-
          cloudflared did not become healthy (failed task: {{ ansible_failed_task.name | default('unknown') }}).
          The last journal lines are printed above. Common causes: invalid or revoked tunnel token,
          outbound 7844 (UDP/TCP) blocked, wrong cloudflared_metrics address, version mismatch.
