---
# Generated once, never overwritten, never logged. Written to a temp file and moved into place
# only if the result is exactly 64 characters, so a failure can never leave a truncated secret that
# `creates` would treat as done. Do NOT rotate the storage key without re-encrypting the DB.
- name: Generate secrets (only if missing)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      umask 077
      tmp="$(mktemp /srv/identity/secrets/.{{ item }}.XXXXXX)"
      trap 'rm -f "$tmp"' EXIT
      head -c 48 /dev/urandom | base64 -w0 > "$tmp"
      test "$(wc -c < "$tmp")" -eq 64
      mv "$tmp" "/srv/identity/secrets/{{ item }}"
    creates: "/srv/identity/secrets/{{ item }}"
    executable: /bin/bash
  loop: "{{ identity_secret_names }}"
  no_log: true

- name: Enforce secret ownership (root-owned, readable by the service group only)
  ansible.builtin.file:
    path: "/srv/identity/secrets/{{ item }}"
    state: file
    owner: root
    group: identity
    mode: "0440"
  loop: "{{ identity_secret_names }}"

- name: Read the metadata of the secrets (never their contents)
  ansible.builtin.stat:
    path: "/srv/identity/secrets/{{ item }}"
  register: identity_secret_stat
  loop: "{{ identity_secret_names }}"

# Fail-safe, not self-healing: regenerating the storage key would orphan the encrypted Authelia DB.
- name: Refuse to continue with a missing or truncated secret
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.size == 64
    fail_msg: >-
      Secret '{{ item.item }}' is missing or not 64 bytes. Restore it from backup. Delete it only
      for jwt/session (they can be regenerated); never for 'storage' without re-encrypting the DB.
    quiet: true
  loop: "{{ identity_secret_stat.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Install the SMTP password
  ansible.builtin.copy:
    content: "{{ authelia_smtp_password }}"
    dest: /srv/identity/secrets/authelia_smtp_password
    owner: root
    group: identity
    mode: "0440"
  when: authelia_smtp_address | length > 0 and authelia_smtp_password | length > 0
  no_log: true

- name: Remove a stale SMTP password when SMTP is not configured
  ansible.builtin.file:
    path: /srv/identity/secrets/authelia_smtp_password
    state: absent
  when: authelia_smtp_address | length == 0 or authelia_smtp_password | length == 0

- name: Install the Vaultwarden SMTP password
  ansible.builtin.copy:
    content: "{{ vaultwarden_smtp_password }}"
    dest: /srv/identity/secrets/vaultwarden_smtp_password
    owner: root
    group: identity
    mode: "0440"
  when: identity_vw_smtp_auth | bool
  no_log: true

- name: Remove a stale Vaultwarden SMTP password
  ansible.builtin.file:
    path: /srv/identity/secrets/vaultwarden_smtp_password
    state: absent
  when: not (identity_vw_smtp_auth | bool)
