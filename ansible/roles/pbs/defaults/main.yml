---
# PBS 4 on Debian 13 (trixie) only; install.yml asserts this because the keyring URL is trixie-specific.
pbs_keyring_url: https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg
# SHA-256 of the trixie keyring as published in Proxmox's installation docs
# (https://pbs.proxmox.com/docs/installation.html, "Install Proxmox Backup Server on Debian").
# Checked only when the key is downloaded. If Proxmox ever rotates the key the download fails closed:
# compare the new hash with the docs, then update it here. Empty means TLS-only trust (warning shown).
pbs_keyring_checksum: "sha256:136673be77aba35dcce385b28737689ad64fd785a797e57897589aed08db6e45"
# Proxmox Backup Server subscription key. Keep the real value in ansible-vault.
#   Empty: no-subscription repository; the pbs-enterprise source is written as disabled,
#          because without a subscription it fails every `apt update` with 401.
#   Set:   the key is registered on the host and the enterprise repository is used
#          (the no-subscription repository is only a temporary bootstrap source for the install).
pbs_subscription_key: ""

pbs_datastore_name: main # = TF_VAR_pbs_datastore
pbs_datastore_path: /srv/pbs/main
# Directory that must be a mount point of its own when pbs_datastore_require_mount is true. It is the
# PARENT of the datastore path on purpose: the datastore then sits in a subdirectory of the mount, so a
# fresh filesystem's lost+found never lands in the datastore root.
pbs_datastore_mountpoint: "{{ pbs_datastore_path | dirname }}"
# Fail unless the datastore sits on its own mount (LXC mount point, HDD). On the container's root
# disk the backups are lost with the container. Set false only if you accept that (a warning is shown).
pbs_datastore_require_mount: true
pbs_prune_schedule: "04:00"
pbs_gc_schedule: "sat 05:00"
pbs_verify_schedule: "sun 06:00"
pbs_verify_outdated_after: 30 # days
pbs_keep:
  daily: 7
  weekly: 4
  monthly: 6

# Matches TF var pbs_username = pve-backup@pbs!pve. Token needs DatastoreBackup only.
pbs_pve_user: pve-backup@pbs
pbs_pve_token_name: pve
pbs_token_file: /root/pbs-pve-token
# One-off: -e pbs_token_regenerate=true deletes and recreates the token. The old secret stops
# working, so update Terraform/PVE afterwards. Needed only if the secret file was lost.
pbs_token_regenerate: false

# Root's password is locked by bootstrap, so create a UI admin in the pbs realm.
pbs_admin_user: admin@pbs
pbs_admin_password: "" # vault; empty = skip. Applied only when the user is created.

# ---- off-box copy: push sync to a second PBS (disabled until configured) ----
pbs_sync_enabled: false
pbs_sync_remote_name: offsite
pbs_sync_remote_host: "" # host or host:port of the offsite PBS
pbs_sync_remote_auth_id: "" # e.g. push-main@pbs!main, with DatastoreBackup on the offsite datastore ONLY
pbs_sync_remote_password: "" # that token's secret (vault)
pbs_sync_remote_fingerprint: "" # offsite PBS certificate fingerprint
pbs_sync_remote_datastore: ""
pbs_sync_schedule: "08:00" # after the 04:00 prune and the sun 06:00 verify

# ---- failure notifications via SMTP (disabled until configured) ----
pbs_notify_enabled: false
pbs_notify_endpoint_name: homelab-mail
pbs_notify_matcher_name: homelab-errors
pbs_notify_smtp_server: ""
pbs_notify_smtp_port: 587
pbs_notify_smtp_mode: starttls # insecure | starttls | tls
pbs_notify_smtp_username: ""
pbs_notify_smtp_password: "" # vault
pbs_notify_from_address: ""
pbs_notify_mailto: "" # one address (use an alias for several)
pbs_notify_severity: error
