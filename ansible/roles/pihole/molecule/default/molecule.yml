---
# Requires molecule-plugins[docker]. Image is pinned by SHA-256 digest.
driver:
  name: docker
platforms:
  - name: pihole-molecule
    image: geerlingguy/docker-debian12-ansible@sha256:e365f7f43a95b8bd31b4ed25da1a4e3a5ae576151c4df67cf51776e696644e4e
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: ""
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
