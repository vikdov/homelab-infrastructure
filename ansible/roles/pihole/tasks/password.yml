---
# Stateless: ask the API whether the desired password works, and check that a password hash is
# stored at all (a Pi-hole without a password may accept any login). No marker file, no stored
# hash on our side; UI-side password changes are corrected on the next run.
# Limitation: with 2FA enabled the API replies with a status other than 200/401 and this fails.
- name: Test the desired web password against the API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ pihole_web_port }}/api/auth"
    method: POST
    body_format: json
    body:
      password: "{{ pihole_web_password }}"
    status_code: [200, 401]
  register: pihole_auth
  retries: 5
  delay: 3
  until: pihole_auth.status is defined and pihole_auth.status in [200, 401]
  changed_when: false
  check_mode: false
  no_log: true

# Verify the key name on your version: pihole-FTL --config webserver.api
- name: Read whether a web password hash is stored
  ansible.builtin.command:
    argv: [pihole-FTL, --config, webserver.api.pwhash]
  register: pihole_pwhash
  changed_when: false
  check_mode: false
  no_log: true

- name: Decide whether the password must be set
  ansible.builtin.set_fact:
    pihole_password_needs_set: >-
      {{ (pihole_pwhash.stdout | trim | replace('"', '') | length == 0)
         or not (pihole_auth.json.session.valid | default(false)) }}

# The password is passed through the environment so it stays out of Ansible's own command line,
# but `pihole setpassword` takes it as an argument, so it is briefly visible in the argv of the
# pihole/pihole-FTL processes it starts. Accepted: short-lived, and the host is single-purpose.
- name: Set Pi-hole web password
  ansible.builtin.shell: pihole setpassword "$PIHOLE_PW"
  args:
    executable: /bin/bash
  environment:
    PIHOLE_PW: "{{ pihole_web_password }}"
  changed_when: true
  no_log: true
  when: pihole_password_needs_set | bool

- name: Verify the web password now works
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ pihole_web_port }}/api/auth"
    method: POST
    body_format: json
    body:
      password: "{{ pihole_web_password }}"
    status_code: [200, 401]
  register: pihole_auth_verify
  retries: 5
  delay: 3
  until: pihole_auth_verify.json.session.valid | default(false)
  changed_when: false
  no_log: true
  when:
    - not ansible_check_mode
    - pihole_password_needs_set | bool
