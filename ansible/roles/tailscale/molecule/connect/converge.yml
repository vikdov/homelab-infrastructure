---
- name: Converge
  hosts: all
  become: true
  gather_facts: false
  vars:
    tailscale_hostname: homelab-net
    tailscale_authkey: tskey-auth-molecule-secret
    tailscale_advertise_routes:
      - 10.10.0.0/16
      - 192.168.1.0/24
  tasks:
    - name: First login through the connect tasks
      ansible.builtin.import_role:
        name: tailscale
        tasks_from: connect
