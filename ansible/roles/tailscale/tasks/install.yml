---
- name: Check platform
  ansible.builtin.assert:
    that:
      - tailscale_repo_distro in ['debian', 'ubuntu']
      - ansible_facts['service_mgr'] == 'systemd'
    fail_msg: The tailscale role supports Debian and Ubuntu hosts running systemd.
    quiet: true

- name: Validate the node hostname
  ansible.builtin.assert:
    that: tailscale_hostname is match('^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$')
    fail_msg: "Invalid tailscale_hostname '{{ tailscale_hostname }}': use a DNS label (letters, digits, hyphens)."
    quiet: true

- name: Validate advertised routes (IPv4 CIDR only)
  ansible.builtin.assert:
    that: item is match('^[0-9]{1,3}([.][0-9]{1,3}){3}/[0-9]{1,2}$')
    fail_msg: "Invalid route '{{ item }}': only IPv4 CIDRs are supported (forwarding is enabled for IPv4 only)."
    quiet: true
  loop: "{{ tailscale_advertise_routes }}"

- name: Check for /dev/net/tun
  ansible.builtin.stat:
    path: /dev/net/tun
  register: tailscale_tun

- name: Fail early when the TUN device is missing
  ansible.builtin.assert:
    that: tailscale_tun.stat.exists
    fail_msg: >-
      /dev/net/tun is missing. Run playbooks/pve.yml first
      (it passes the device in and restarts the container).
    quiet: true

- name: Install apt prerequisites
  ansible.builtin.apt:
    name: ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: "{{ bootstrap_apt_lock_timeout | default(300) }}"

# With a checksum the key is pinned (and re-downloaded when the checksum changes);
# without one trust is TLS-only and the key is not refreshed once present.
- name: Download the signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ tailscale_repo_distro }}/{{ tailscale_repo_codename }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    checksum: "{{ tailscale_signing_key_checksum | default(omit, true) }}"
    force: false
    owner: root
    group: root
    mode: "0644"

- name: Add the apt repository (deb822)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible
      Types: deb
      URIs: https://pkgs.tailscale.com/stable/{{ tailscale_repo_distro }}
      Suites: {{ tailscale_repo_codename }}
      Components: main
      Signed-By: /usr/share/keyrings/tailscale-archive-keyring.gpg
  notify: Update apt cache for tailscale

- name: Refresh apt before installing from the new repository
  ansible.builtin.meta: flush_handlers

- name: Install tailscale
  ansible.builtin.apt:
    name: "tailscale{{ ('=' ~ tailscale_version) if tailscale_version | length > 0 else '' }}"
    state: present
    allow_downgrade: "{{ tailscale_version | length > 0 }}"
    lock_timeout: "{{ bootstrap_apt_lock_timeout | default(300) }}"

- name: Enable IPv4 forwarding (subnet router)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-tailscale.conf
    content: "net.ipv4.ip_forward = 1\n"
    owner: root
    group: root
    mode: "0644"
  when: tailscale_advertise_routes | length > 0
  notify: Apply tailscale sysctl

# The running value stays until the next reboot; only the persistent setting is removed.
- name: Drop the forwarding config when no routes are advertised
  ansible.builtin.file:
    path: /etc/sysctl.d/99-tailscale.conf
    state: absent
  when: tailscale_advertise_routes | length == 0

- name: Apply sysctl now
  ansible.builtin.meta: flush_handlers

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
