---
- name: Install tar and CA certificates
  ansible.builtin.apt:
    name: [tar, ca-certificates]
    state: present
    lock_timeout: "{{ traefik_apt_lock_timeout }}"

- name: Service user
  ansible.builtin.user:
    name: traefik
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /opt/traefik, mode: "0755" }
    - { path: "/opt/traefik/{{ traefik_version }}", mode: "0755" }
    - { path: /etc/traefik, mode: "0755" }
    - { path: /etc/traefik/dynamic, mode: "0755" }
    - { path: /var/lib/traefik, owner: traefik, group: traefik, mode: "0700" }

# Versioned install dir + symlink: changing traefik_version upgrades, and a rollback is one variable.
- name: Check whether this release is already unpacked
  ansible.builtin.stat:
    path: "/opt/traefik/{{ traefik_version }}/traefik"
  register: traefik_binary_stat

# The network is only needed when the release is not on disk yet.
- name: Download and unpack the release
  when: not traefik_binary_stat.stat.exists
  block:
    - name: Download the release (checksum verified against the published checksums file)
      ansible.builtin.get_url:
        url: "{{ traefik_release_url }}/traefik_v{{ traefik_version }}_linux_{{ traefik_arch_effective }}.tar.gz"
        dest: "/opt/traefik/{{ traefik_version }}/traefik.tar.gz"
        checksum: "sha256:{{ traefik_release_url }}/traefik_v{{ traefik_version }}_checksums.txt"
        owner: root
        group: root
        mode: "0644"
        timeout: 60

    - name: Unpack the binary
      ansible.builtin.unarchive:
        src: "/opt/traefik/{{ traefik_version }}/traefik.tar.gz"
        dest: "/opt/traefik/{{ traefik_version }}"
        remote_src: true
        include: [traefik]
        creates: "/opt/traefik/{{ traefik_version }}/traefik"
        owner: root
        group: root
      when: not ansible_check_mode

    - name: Binary is root-owned and executable
      ansible.builtin.file:
        path: "/opt/traefik/{{ traefik_version }}/traefik"
        owner: root
        group: root
        mode: "0755"
      when: not ansible_check_mode

    - name: Remove the tarball
      ansible.builtin.file:
        path: "/opt/traefik/{{ traefik_version }}/traefik.tar.gz"
        state: absent

# Never point the symlink at a binary that is not the pinned release.
- name: Check the unpacked binary reports the pinned version
  ansible.builtin.command:
    argv: ["/opt/traefik/{{ traefik_version }}/traefik", version]
  register: traefik_binary_version
  changed_when: false
  failed_when: not (traefik_binary_version.stdout is search(traefik_expected_regex))
  vars:
    traefik_expected_regex: '(?m)^Version:\s+{{ traefik_version | regex_escape }}\s*$'
  when: not ansible_check_mode

- name: Point /usr/local/bin/traefik at this version
  ansible.builtin.file:
    src: "/opt/traefik/{{ traefik_version }}/traefik"
    dest: /usr/local/bin/traefik
    state: link
  notify: Restart traefik

- name: List installed versions
  ansible.builtin.find:
    paths: /opt/traefik
    file_type: directory
    patterns: '^[0-9]+[.][0-9]+[.][0-9]+$'
    use_regex: true
  register: traefik_installed

# Keep the active version plus (traefik_keep_versions - 1) most recent others for rollback.
- name: Remove versions outside the retention window
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: >-
    {{ (traefik_installed.files
        | rejectattr('path', 'equalto', '/opt/traefik/' ~ traefik_version)
        | sort(attribute='mtime', reverse=true)
        | list)[(traefik_keep_versions | int) - 1:] }}
  loop_control:
    label: "{{ item.path }}"
