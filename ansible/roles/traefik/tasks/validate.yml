---
# Fail early, with readable messages. Nothing here touches the host.
- name: Validate that facts were gathered
  ansible.builtin.assert:
    that:
      - ansible_facts.architecture is defined
      - ansible_facts.date_time is defined
    fail_msg: >-
      The traefik role needs gathered facts (architecture, date_time). Run setup before it
      when the play uses gather_facts false.
    quiet: true

- name: Validate install settings
  ansible.builtin.assert:
    that:
      - traefik_version is match('^3[.][0-9]+[.][0-9]+$')
      - traefik_arch_effective in ['amd64', 'arm64']
      - traefik_keep_versions | int >= 1
      - traefik_acme_backups_keep | int >= 1
    fail_msg: >-
      traefik_version must be an exact v3 release such as 3.7.17 (no leading "v"),
      the architecture amd64 or arm64 (traefik_arch: auto needs x86_64 or aarch64),
      traefik_keep_versions and traefik_acme_backups_keep >= 1.
    quiet: true

- name: Validate the metrics address
  vars:
    traefik_octet: "(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])"
  ansible.builtin.assert:
    that:
      - "traefik_metrics_address is match('^(' ~ traefik_octet ~ '[.]){3}' ~ traefik_octet ~ ':[0-9]{1,5}$')"
      - not (traefik_metrics_address is match('^0[.]0[.]0[.]0:'))
      - (traefik_metrics_address.split(':')[1] | int) >= 1
      - (traefik_metrics_address.split(':')[1] | int) <= 65535
      - (traefik_metrics_address.split(':')[1] | int) not in [80, 443, 8081]
    fail_msg: >-
      traefik_metrics_address must be a specific IPv4:port such as 127.0.0.1:8082
      (0.0.0.0 is refused, and ports 80, 443 and 8081 are taken by entrypoints).
    quiet: true

- name: Validate domain and ACME contact
  ansible.builtin.assert:
    that:
      - traefik_domain is match('^([a-z0-9]([a-z0-9-]*[a-z0-9])?[.])+[a-z]{2,}$')
      - not (traefik_domain is search('(^|[.])example[.](com|org|net)$'))
      - traefik_acme_email is match('^[^@ ]+@[^@ ]+[.][^@ ]+$')
      - not (traefik_acme_email is search('@example[.](com|org|net)$'))
    fail_msg: >-
      Set traefik_domain and traefik_acme_email to real values. Placeholder example.* values are
      refused so they cannot reach Let's Encrypt.
    quiet: true

- name: Validate the DNS challenge tokens
  ansible.builtin.assert:
    that:
      - traefik_cf_dns_token | length > 0
      - traefik_cf_dns_token is match('^[A-Za-z0-9_-]+$')
      - traefik_cf_zone_token is match('^[A-Za-z0-9_-]*$')
    fail_msg: >-
      Set traefik_cf_dns_token (vault_cf_dns_token in the vault). Cloudflare API tokens contain
      only letters, digits, "_" and "-"; the same holds for the optional traefik_cf_zone_token.
    quiet: true

- name: Validate Authelia settings
  ansible.builtin.assert:
    that:
      - not (traefik_authelia_enabled | bool) or (traefik_authelia_url is match('^https?://[^/ ]+$'))
      - traefik_authelia_authz_path is match('^/')
    fail_msg: >-
      traefik_authelia_url must be http(s)://host[:port] (no path) when Authelia is enabled,
      and traefik_authelia_authz_path must start with "/".
    quiet: true

- name: Validate traefik services
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
      - not (item.name is search('-public$'))
      - item.upstream is match('^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?$')
      - (traefik_validate_mws | difference(traefik_known_middlewares) | length) == 0
      - (traefik_validate_mws | unique | length) == (traefik_validate_mws | length)
      - (traefik_authelia_enabled | bool) or ('authelia' not in traefik_validate_mws)
      - (traefik_rate_limit_enabled | bool) or ('rate-limit' not in traefik_validate_mws)
      - (traefik_inflight_enabled | bool) or ('in-flight' not in traefik_validate_mws)
      - not (traefik_validate_pub) or ('authelia' in traefik_validate_mws) or (traefik_validate_unauth)
    fail_msg: >-
      Invalid traefik service {{ item }}. Need a lowercase DNS label as name (not ending in "-public"),
      upstream as http(s)://host[:port], no duplicate middlewares, only known middlewares
      (authelia, rate-limit, in-flight) that are enabled, and a public service needs the
      authelia middleware or allow_public_unauthenticated: true.
    quiet: true
  vars:
    traefik_validate_mws: "{{ item.middlewares | default([]) }}"
    traefik_validate_pub: "{{ item.public | default(false) | bool }}"
    traefik_validate_unauth: "{{ item.allow_public_unauthenticated | default(false) | bool }}"
  loop: "{{ traefik_services }}"
  loop_control:
    label: "{{ item.name | default(item) }}"

- name: Service names are unique
  ansible.builtin.assert:
    that:
      - >-
        (traefik_services | map(attribute='name') | list | length) ==
        (traefik_services | map(attribute='name') | unique | list | length)
    fail_msg: Duplicate name in traefik_services.
    quiet: true
